name: cross-repo-validate

# Validates this PR's gubbi-common against downstream consumers BEFORE merge.
# This is the gate required by D4: "cross-repo CI infrastructure FIRST, then
# promote 5 modules ONE-AT-A-TIME validated by cross-repo CI."
#
# Secret requirements:
#   GUBBI_CLOUD_PAT (GitHub personal access token with repo scope) must be
#   created in the gubbi-common repo Settings > Secrets and variables > Actions.
#   Without it, the gubbi-cloud matrix entry fails fast at the verify step
#   with an actionable error; the gubbi step still runs unconditionally and
#   blocks merge on failure.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-downstream:
    name: downstream (${{ matrix.repo }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `secrets` context is not available in step-level `if` conditions
    # (only in `env`, `with`, `run`). Mirror the secret into a job-level env
    # var so the gubbi-cloud-specific guards can read it via `env`. The verify
    # step below fails the job when the PAT is missing on a gubbi-cloud entry,
    # so subsequent `env.GUBBI_CLOUD_PAT != ''` checks are belt-and-braces.
    env:
      GUBBI_CLOUD_PAT: ${{ secrets.GUBBI_CLOUD_PAT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: gubbi
            cloud: false
          - repo: gubbi-cloud
            cloud: true

    steps:
      # Both repos must live inside $GITHUB_WORKSPACE: actions/checkout@v4
      # rejects paths that escape it. Lay them out as siblings under the
      # workspace so the downstream's `path = "../gubbi-common"` override
      # below resolves correctly.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: gubbi-common
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: false

      # -- Fail fast when gubbi-cloud PAT is missing --------------------------
      # Without this guard, actions/checkout below silently degrades to an
      # unauthenticated request when the PAT is unset and 404s on the private
      # gubbi-cloud repo with a generic error. Explicit guard fails fast with
      # an actionable message pointing the operator at the secret config.
      - name: Verify GUBBI_CLOUD_PAT is configured
        if: matrix.cloud
        env:
          GUBBI_CLOUD_PAT: ${{ secrets.GUBBI_CLOUD_PAT }}
        run: |
          if [ -z "${GUBBI_CLOUD_PAT:-}" ]; then
            echo "ERROR: secrets.GUBBI_CLOUD_PAT is unset or empty." >&2
            echo "This PAT is required to clone the private meepolabs/gubbi-cloud repo for cross-repo validation." >&2
            echo "Configure it under GitHub repo / org Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      # -- Checkout downstream repo -------------------------------------------
      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: meepolabs/${{ matrix.repo }}
          ref: main
          path: ${{ matrix.repo }}
          # gubbi-cloud is private; authenticate with the PAT. Guarded above.
          token: ${{ secrets.GUBBI_CLOUD_PAT }}
          persist-credentials: false

      # -- Override gubbi-common git-pin to local path ------------------------
      # Poetry inline tables are always one line. We match on the line content,
      # replace it in-place while preserving indentation. No multi-line hacks.
      - name: Replace gubbi-common dependency
        if: (!matrix.cloud || env.GUBBI_CLOUD_PAT != '')
        working-directory: ${{ matrix.repo }}
        run: |
          python3 << 'PYEOF'
          import sys

          pyfile = "pyproject.toml"
          replacement = (
              '"gubbi-common" = { path = "../gubbi-common", develop = true,'
              ' extras = ["db"] }'
          )
          changed = False
          with open(pyfile) as f:
              lines = f.readlines()

          for i, line in enumerate(lines):
              if "gubbi-common" in line and ("git =" in line or "git=" in line):
                  indent = len(line) - len(line.lstrip())
                  lines[i] = " " * indent + replacement.strip() + "\n"
                  changed = True
                  break

          if not changed:
              print("WARNING: no gubbi-common git-pin found in %s" % pyfile, file=sys.stderr)

          with open(pyfile, "w") as f:
              f.writelines(lines)
          PYEOF

      # -- Lock + Install -----------------------------------------------------
      - name: poetry lock (no-update)
        if: (!matrix.cloud || env.GUBBI_CLOUD_PAT != '')
        working-directory: ${{ matrix.repo }}
        run: poetry lock --no-update

      - name: poetry install
        if: (!matrix.cloud || env.GUBBI_CLOUD_PAT != '')
        working-directory: ${{ matrix.repo }}
        run: poetry install --no-interaction

      # -- Run tests ----------------------------------------------------------
      # gubbi: full suite minus integration. The integration tests are excluded
      # here, so no Postgres service is needed for this contract gate.
      - name: Run gubbi tests
        if: '!matrix.cloud'
        working-directory: ${{ matrix.repo }}
        run: poetry run pytest tests/ -x --ignore=tests/integration

      # gubbi-cloud: narrow unit-only gate for now (start narrow; expand later).
      - name: Run gubbi-cloud unit tests
        if: matrix.cloud && env.GUBBI_CLOUD_PAT != ''
        working-directory: ${{ matrix.repo }}
        run: poetry run pytest tests/unit/ -x
