# Dependency vulnerabilities, read straight off the lockfiles so no dev
# dependency has to be installed for the scan to run.
#
# Advisory: a finding turns this workflow red but must not gate merges --
# keep it out of any required check. Renovate security PRs clear findings.
#
# Why the scanner image and not google/osv-scanner-action: that action ships
# REUSABLE WORKFLOWS whose `upload-sarif` input defaults to true, which
# needs `security-events: write` plus GitHub code scanning -- not available
# for private repos on a free plan. Running the image directly keeps one
# pattern that works on public and private repos alike, and keeps this job
# on `contents: read`.
#
# The image is pinned by tag AND multi-arch index digest; Renovate's
# github-actions manager bumps both together.

name: dependency-scan

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `-r .` walks the tree and picks up every lockfile it recognises,
      # including any outside the repo root. Exits non-zero on a finding.
      - name: Scan lockfiles
        uses: docker://ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
        with:
          args: scan source -r .
