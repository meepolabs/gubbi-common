name: test

# pull_request is unfiltered on purpose: test.yml also runs the secret
# scan, so a branch filter here would leave pull requests into other
# branches unscanned.
on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.4.1-${{ hashFiles('poetry.lock') }}

      # Unconditional: the cache key hashes poetry.lock only, so a
      # pyproject.toml edit without a relock would otherwise hit the cache
      # and skip the install that would have caught it.
      - name: Check lock file matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras db

      # Purity lint runs first: a runtime-import-of-framework violation
      # should fail the build before slower static-analysis steps.
      - name: gubbi-common purity lint
        run: poetry run python tools/check_gubbi_common_purity.py

      - name: ruff check
        run: poetry run ruff check gubbi_common/ tests/ tools/

      - name: ruff format --check
        run: poetry run ruff format --check gubbi_common/ tests/ tools/

      - name: mypy
        run: poetry run mypy gubbi_common/ tools/

  test:
    name: test (py312)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest: a tag can move to another build with no commit
        # here. Verified to run PostgreSQL 17.11 with pgvector 0.8.6.
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_gubbi

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The audit_log fixture in tests/integration mirrors the sibling
      # gubbi repo's migration chain, and the staleness guards compare it
      # against the real migration source. Check that source out at an
      # IMMUTABLE revision -- a branch name would let an unrelated sibling
      # commit turn this lane red or, worse, green. REQUIRE_GUBBI_MIGRATIONS
      # below makes a missing checkout fail the lane instead of skipping,
      # so a regression in this step cannot hide.
      - name: Check out pinned gubbi migration source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: meepolabs/gubbi
          ref: a74ae71114d346c4118d67922e2c5e5387d9aaa8
          path: gubbi
          persist-credentials: false

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry2.4.1-${{ hashFiles('poetry.lock') }}

      # Unconditional: the cache key hashes poetry.lock only, so a
      # pyproject.toml edit without a relock would otherwise hit the cache
      # and skip the install that would have caught it.
      - name: Check lock file matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras db

      # INTEGRATION=1 un-skips the tests under tests/integration (audit dedup +
      # schema drift). They use testcontainers to spin their own
      # pgvector/pgvector:pg16 Postgres via the runner's Docker daemon -- they
      # do NOT connect to the `postgres` service above. The service + DATABASE_URL
      # are retained as a belt-and-braces fallback for any future test that reads
      # DATABASE_URL directly.
      #
      # REQUIRE_GUBBI_MIGRATIONS=1 turns an absent sibling checkout into a
      # failure rather than a skip: in this lane the source is guaranteed
      # present by the pinned checkout above, so absence means that step
      # broke.
      - name: Run pytest
        env:
          INTEGRATION: "1"
          REQUIRE_GUBBI_MIGRATIONS: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_gubbi
        run: poetry run pytest tests/ -x --cov=gubbi_common --cov-report=term-missing

  gitleaks:
    name: gitleaks
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit

  # The single branch-rule context. It must list every blocking lane:
  # a lane missing from `needs` is not gated at all.
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - lint
      - test
      - gitleaks
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # Standard library only, on the runner's own python3: nothing to install.
      - name: needs lists every other job
        run: python3 tools/check_required_needs.py --self-test .github/workflows/test.yml

      - name: every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "dependency results: $RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "required: at least one job did not succeed" >&2
            exit 1
          fi
          printf '%s' "$RESULTS" | grep -q '"success"' || { echo "required: no results" >&2; exit 1; }
