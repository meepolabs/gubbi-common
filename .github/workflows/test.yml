name: test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras db

      # Purity lint runs first: a runtime-import-of-framework violation
      # should fail the build before slower static-analysis steps.
      - name: gubbi-common purity lint
        run: poetry run python tools/check_gubbi_common_purity.py

      - name: ruff check
        run: poetry run ruff check gubbi_common/ tests/

      - name: ruff format --check
        run: poetry run ruff format --check gubbi_common/ tests/

      - name: mypy
        run: poetry run mypy gubbi_common/

  test:
    name: test (py312)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_gubbi

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --extras db

      # INTEGRATION=1 un-skips the tests under tests/integration (audit dedup +
      # schema drift). They use testcontainers to spin their own
      # pgvector/pgvector:pg16 Postgres via the runner's Docker daemon -- they
      # do NOT connect to the `postgres` service above. The service + DATABASE_URL
      # are retained as a belt-and-braces fallback for any future test that reads
      # DATABASE_URL directly.
      - name: Run pytest
        env:
          INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_gubbi
        run: poetry run pytest tests/ -x --cov=gubbi_common --cov-report=term-missing

  # Dependency vulnerabilities, read straight off poetry.lock so no dev
  # dependency has to be installed for the gate to run. A `pip-audit` step
  # was prescribed for Python CI long before this and never adopted in any
  # repo, precisely because it needed a dev-group entry -- keep one gate in
  # one place rather than adding both.
  #
  # Why the pinned CLI and not google/osv-scanner-action: that action ships
  # REUSABLE WORKFLOWS whose `upload-sarif` input defaults to true, which
  # needs `security-events: write` plus GitHub code scanning -- not available
  # for private repos on a free plan. Calling the pinned binary keeps one
  # pattern that works on public and private repos alike, and keeps this job
  # on `contents: read`.
  #
  # Pin + verify the checksum before running, so a tampered release artifact
  # fails the job rather than executing.
  osv-scan:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install osv-scanner
        env:
          OSV_VERSION: 2.5.1
        run: |
          set -euo pipefail
          BASE="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -sSfL -o /tmp/osv-scanner    "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o /tmp/osv_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          # The checksums file names the upstream artifact, so verify under
          # that name before renaming it into place.
          ( cd /tmp && cp osv-scanner osv-scanner_linux_amd64 \
            && grep ' osv-scanner_linux_amd64$' osv_SHA256SUMS | sha256sum --check --status )
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # `-r .` walks the tree and picks up every lockfile it recognises,
      # including any outside the repo root. Exits non-zero on a finding.
      - name: Scan lockfiles
        run: osv-scanner scan source -r .
